<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F6F8" />
    <meta name="description" content="Apex Finance desktop — plan, track and grow your savings and portfolio." />
    <title>Apex Finance — Desktop</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('apex.desktop.v2') || 'null') || {};
        var theme =
          saved.theme === 'light' || saved.theme === 'dark' || saved.theme === 'system'
            ? saved.theme
            : typeof saved.darkMode === 'boolean'
              ? saved.darkMode
                ? 'dark'
                : 'light'
              : 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#050F2C' : '#F5F6F8');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
