name: apex-suite

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apex
    ports:
      - "${APEX_DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apex"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-env
      DATABASE_URL: postgres://postgres:postgres@db:5432/apex
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/apex
      HOST: 0.0.0.0
      PORT: "4000"
      AUTH_SECRET: apex-compose-development-secret
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run -w @apex/api db:migrate && npm run -w @apex/api db:seed-if-empty"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    ports:
      - "${APEX_API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
